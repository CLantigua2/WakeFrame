name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Stage portable files
        shell: pwsh
        run: .\scripts\package-portable.ps1 -Version "$env:APP_VERSION" -SkipBuild

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: .\scripts\package-installer.ps1 -Version "$env:APP_VERSION" -SkipBuild

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/WakeFrame-Setup.exe
            dist/WakeFrame-Portable-${{ env.APP_VERSION }}.zip
          generate_release_notes: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeFrame-${{ env.APP_VERSION }}
          path: |
            dist/installer/WakeFrame-Setup.exe
            dist/WakeFrame-Portable-${{ env.APP_VERSION }}.zip
