[workspace]
members = [
  "crates/wakeframe-common",
  "crates/wakeframe-agent",
  "crates/wakeframe-player",
  "crates/wakeframe-ui"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
